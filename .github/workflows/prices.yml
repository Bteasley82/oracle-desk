name: Refresh prices

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC), at :17 to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update prices from CoinGecko
        # If this fails the script exits non-zero, leaves the feed untouched and the job stops here (no commit).
        run: python3 scripts/update_prices.py

      - name: Commit oracle-feed.json if it changed
        run: |
          if git diff --quiet -- oracle-feed.json; then
            echo "No change to oracle-feed.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oracle-feed.json
          git commit -m "prices: refresh $(date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed" >&2
          exit 1
